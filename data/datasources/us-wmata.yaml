identifier: us-wmata
region: us
provider:
  name: Washington Metropolitan Area Transit Authority
  website: "https://www.wmata.com/"
datasets:
- identifier: bus-gtfs-schedule
  format: gtfs-schedule
  source: "https://api.wmata.com/gtfs/bus-gtfs-static.zip"
  sourceauthentication:
    header:
      api_key: TRAVIGO_WMATA_API_KEY
  datasetsize: large
  supportedobjects:
    stops: true
    services: true
    journeys: true
    operators: true
- identifier: rail-gtfs-schedule
  format: gtfs-schedule
  source: "https://api.wmata.com/gtfs/rail-gtfs-static.zip"
