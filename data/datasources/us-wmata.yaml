  source: "https://api.wmata.com/gtfs/bus-gtfsrt-tripupdates.pb"
  sourceauthentication:
    header:
      api_key: TRAVIGO_WMATA_API_KEY
  linkeddataset: us-wmata-bus-gtfs-schedule
  importdestination: realtime-queue
  supportedobjects:
    realtimejourneys: true
- identifier: bus-gtfs-realtime-vehicle-positions
