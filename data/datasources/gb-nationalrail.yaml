identifier: gb-nationalrail
region: gb
provider:
  name: National Rail
  website: "https://nationalrail.co.uk"
overrides:
  servicebranding:
    - operators: [gb-toc-ES]  # Eurostar
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#00286A"
        secondarycolour: "#FCF5D8"
        icon: "/icons/eurostar.webp"
    # Current GWR site palette and logo asset:
    # https://www.gwr.com/about-gwr
    # https://www.gwr.com/img/logo-gwr.png
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-GW]
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#0A493E"
    # ScotRail core blue from Scotland's 2023 identity guidelines:
    # https://www.transport.gov.scot/media/5jcjdjmv/scotrail-guidelines-core-identity-p4-p13.pdf
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-SR]
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#002664"
    # TfL Colour Standard lists the London Underground mode colour as RGB 0,25,168:
    # https://content.tfl.gov.uk/tfl-colour-standard.pdf
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-LT]
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#0019A8"
    # Approximate screen colors visually sampled from current official brand
    # assets. These operators do not publish service-badge HEX values.
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-CS]  # Caledonian Sleeper
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#006B68"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-EM]  # East Midlands Railway
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#5B2C83"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-GC]  # Grand Central
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#F58220"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-HT]  # Hull Trains
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#0076A8"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-HX]  # Heathrow Express
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#592C82"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-LD]  # Lumo
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#009FE3"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-ME]  # Merseyrail
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#F2C900"
    - datasets: ["gb-nationalrail-toc"]
      operators: [gb-toc-GR]  # LNER
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#ce0e2d"
    - datasets: ["gb-nationalrail-toc"] 
      operators: [gb-toc-TL]  # Thameslink
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#ced0d2"
    - datasets: ["gb-nationalrail-toc"] 
      operators: [gb-toc-GN]  # Great Northern
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#43165c"
    - datasets: ["gb-nationalrail-toc"] 
      operators: [gb-toc-SE]  # South Eastern
      transporttypes: [Rail]
      fallback: true
      set:
        colour: "#1e1e50"
        secondarycolour: "#32bef0"
datasets:
- identifier: toc
  format: gb-nationalrailtoc
  source: "https://opendata.nationalrail.co.uk/api/staticfeeds/4.0/tocs"
  sourceauthentication:
    custom: "gb-nationalrail-login"
  supportedobjects:
    services: true
    operators: true
- identifier: timetable
  format: gb-cif
  source: "https://opendata.nationalrail.co.uk/api/staticfeeds/3.0/timetable"
  datasetsize: large
  sourceauthentication:
    custom: "gb-nationalrail-login"
  supportedobjects:
    journeys: true
- identifier: darwin
  format: xml-darwin
  source: "https://opendata.nationalrail.co.uk/"
  supportedobjects:
    realtimejourneys: true
    servicealerts: true
  linkeddataset: gb-nationalrail-timetable
  importdestination: specific-runner
- identifier: linx-consist
  format: xml-linx-S506
  source: "https://raildata.org.uk/"
  supportedobjects:
    realtimejourneys: true
  linkeddataset: gb-nationalrail-timetable
  importdestination: specific-runner
