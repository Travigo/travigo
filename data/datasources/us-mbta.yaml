identifier: us-mbta
region: us
# Atlas license metadata requires acknowledging MassDOT as the data provider.
provider:
  name: Massachusetts Bay Transportation Authority
  website: "https://www.mbta.com/"
datasets:
- identifier: gtfs-schedule
  format: gtfs-schedule
  source: "https://cdn.mbta.com/MBTA_GTFS.zip"
  datasetsize: large
  supportedobjects:
    stops: true
    services: true
    journeys: true
    operators: true
- identifier: gtfs-realtime
  format: gtfs-realtime
  source: "https://cdn.mbta.com/realtime/TripUpdates.pb"
  linkeddataset: us-mbta-gtfs-schedule
  importdestination: realtime-queue
  supportedobjects:
    realtimejourneys: true
- identifier: gtfs-realtime-vehicle-positions
  format: gtfs-realtime
  source: "https://cdn.mbta.com/realtime/VehiclePositions.pb"
  linkeddataset: us-mbta-gtfs-schedule
  importdestination: realtime-queue
  customconfig:
    locationonly: "true"
  supportedobjects:
    realtimejourneys: true
- identifier: gtfs-realtime-alerts
  format: gtfs-realtime
  source: "https://cdn.mbta.com/realtime/Alerts.pb"
  linkeddataset: us-mbta-gtfs-schedule
  importdestination: realtime-queue
  supportedobjects:
    servicealerts: true
