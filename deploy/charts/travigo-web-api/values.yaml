# Default values for travigo-web-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/travigo/travigo
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: main

database:
  connectionStringSecret: travigo-mongodb-admin-travigo
  database: travigo
  realtime:
    connectionStringSecret: travigo-realtime-mongodb-travigo
    database: travigo

elasticsearch:
  address: "https://primary-es-http.elastic:9200"
  accountSecret: "travigo-elasticsearch-user"

redis:
  address: "redis-headless.redis:6379"
  passwordSecret: redis-password

bods:
  apiKeySecret: travigo-bods-api

tfl:
  apiKeySecret: travigo-tfl-api-key

auth:
  domain: travigo.uk.auth0.com
  audience: https://api.travigo.app

departureGraph:
  enabled: true
  backgroundEnabled: true
  # Departure boards only need the current and following service days warmed.
  # Older dates can still be filled lazily when explicitly requested.
  daysBehind: 0
  daysAhead: 1
  batchSize: 1000
  batchPause: 250ms
  initialBuildDelay: 30s
  refreshInterval: 24h
  retryInterval: 1m
  snapshotInterval: 15m
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  service:
    port: 8080
  goMemoryLimit: 5GiB
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
  persistence:
    enabled: true
    mountPath: /var/lib/travigo/departure-graph
    fileName: snapshot.gob.zst
    accessMode: ReadWriteOnce
    storageClassName: ebs-gp3
    size: 20Gi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://travigo.app,https://www.travigo.app"
  hosts:
    - host: api.travigo.app
      paths:
        - path: /core
          pathType: ImplementationSpecific


resources:
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
