{{- if .Values.departureGraph.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travigo-web-api.fullname" . }}-departure-graph
  labels:
    {{- include "travigo-web-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: departure-graph
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.departureGraph.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "travigo-web-api.fullname" . }}-departure-graph
{{- end }}
