{{- if .Values.batchRunner.enabled -}}
{{- $secretName := printf "%s-batch-runner-auth" (include "travigo-data-importer.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := randAlphaNum 48 | b64enc -}}
{{- if $existingSecret -}}
{{- $existingToken := index $existingSecret.data "token" -}}
{{- if $existingToken -}}
{{- $token = $existingToken -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "travigo-data-importer.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch-runner
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
