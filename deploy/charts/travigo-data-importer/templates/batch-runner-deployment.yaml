{{- if .Values.batchRunner.enabled -}}
{{- if and .Values.batchRunner.schedule.enabled .Values.batchRunner.smartMode (not .Values.batchRunner.persistence.enabled) -}}
{{- fail "batchRunner.persistence.enabled must be true when scheduled smart mode is enabled so staged artifacts survive runner restarts" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "travigo-data-importer.fullname" . }}-batch-runner
  labels:
    {{- include "travigo-data-importer.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch-runner
spec:
  replicas: {{ .Values.batchRunner.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "travigo-data-importer.fullname" . }}-batch-runner
  template:
    metadata:
      labels:
        app: {{ include "travigo-data-importer.fullname" . }}-batch-runner
        app.kubernetes.io/component: batch-runner
    spec:
      serviceAccountName: {{ include "travigo-data-importer.serviceAccountName" . }}
      {{- with .Values.batchRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.batchRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: batch-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["batch-runner", "server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: artifacts
              containerPort: 8081
              protocol: TCP
          env:
            - name: TRAVIGO_LOG_FORMAT
              value: JSON
            - name: AUTH0_DOMAIN
              value: {{ .Values.auth.domain | quote }}
            - name: AUTH0_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: TRAVIGO_BATCH_RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "travigo-data-importer.fullname" . }}-batch-runner-auth
                  key: token
            - name: TRAVIGO_BATCH_ADDRESS
              value: ":8080"
            - name: TRAVIGO_BATCH_ARTIFACT_ADDRESS
              value: ":8081"
            - name: TRAVIGO_BATCH_ARTIFACT_BASE_URL
              value: "http://{{ include "travigo-data-importer.fullname" . }}-batch-runner-artifacts:8081"
            - name: TRAVIGO_BATCH_STORAGE_PATH
              value: {{ .Values.batchRunner.storagePath | quote }}
            - name: TRAVIGO_BATCH_JOB_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: TRAVIGO_BATCH_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: TRAVIGO_BATCH_JOB_SERVICE_ACCOUNT
              value: {{ include "travigo-data-importer.serviceAccountName" . | quote }}
            - name: TRAVIGO_BATCH_JOB_BACKOFF_LIMIT
              value: {{ .Values.batchRunner.job.backoffLimit | quote }}
            - name: TRAVIGO_BATCH_JOB_TTL_SECONDS
              value: {{ .Values.batchRunner.job.ttlSecondsAfterFinished | quote }}
            - name: TRAVIGO_BATCH_JOB_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.batchRunner.job.activeDeadlineSeconds | quote }}
            - name: TRAVIGO_BATCH_ALLOW_CONCURRENT_RUNS
              value: {{ .Values.batchRunner.allowConcurrentRuns | quote }}
            - name: TRAVIGO_BATCH_BODS_API_KEY_SECRET
              value: {{ .Values.bods.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_TFL_API_KEY_SECRET
              value: {{ .Values.tfl.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_IE_NATIONALTRANSPORT_API_KEY_SECRET
              value: {{ .Values.ie_nationaltransport.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_NATIONALRAIL_CREDENTIALS_SECRET
              value: {{ .Values.nationalRail.credentialsSecret | quote }}
            - name: TRAVIGO_BATCH_NETWORKRAIL_CREDENTIALS_SECRET
              value: {{ .Values.nationalRail.networkRailCredentialsSecret | quote }}
            - name: TRAVIGO_BATCH_TRAFIKLAB_STATIC_SECRET
              value: {{ .Values.se_trafiklab.staticSecret | quote }}
            - name: TRAVIGO_BATCH_TRAFIKLAB_REALTIME_SECRET
              value: {{ .Values.se_trafiklab.realtimeSecret | quote }}
            - name: TRAVIGO_BATCH_ODPT_API_KEY_SECRET
              value: {{ .Values.jp_odpt.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_TRANSLINK_API_KEY_SECRET
              value: {{ .Values.translink.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_WMATA_API_KEY_SECRET
              value: {{ .Values.wmata.apiKeySecret | quote }}
            - name: TRAVIGO_BATCH_TRIMET_APP_ID_SECRET
              value: {{ .Values.trimet.appIDSecret | quote }}
            - name: TRAVIGO_BATCH_MONGODB_CONNECTION_SECRET
              value: {{ .Values.database.connectionStringSecret | quote }}
            - name: TRAVIGO_BATCH_MONGODB_DATABASE
              value: {{ .Values.database.database | quote }}
            - name: TRAVIGO_MONGODB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.connectionStringSecret | quote }}
                  key: connectionString.standard
            - name: TRAVIGO_MONGODB_DATABASE
              value: {{ .Values.database.database | quote }}
            - name: TRAVIGO_NATIONALRAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nationalRail.credentialsSecret | quote }}
                  key: username
                  optional: true
            - name: TRAVIGO_NATIONALRAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nationalRail.credentialsSecret | quote }}
                  key: password
                  optional: true
            - name: TRAVIGO_NETWORKRAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nationalRail.networkRailCredentialsSecret | quote }}
                  key: username
                  optional: true
            - name: TRAVIGO_NETWORKRAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nationalRail.networkRailCredentialsSecret | quote }}
                  key: password
                  optional: true
            - name: TRAVIGO_SE_TRAFIKLAB_STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.se_trafiklab.staticSecret | quote }}
                  key: api_key
                  optional: true
            - name: TRAVIGO_JP_ODPT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jp_odpt.apiKeySecret | quote }}
                  key: api_key
                  optional: true
            - name: TRAVIGO_WMATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wmata.apiKeySecret | quote }}
                  key: api_key
                  optional: true
            - name: TRAVIGO_BATCH_ELASTICSEARCH_ADDRESS
              value: {{ .Values.elasticsearch.address | quote }}
            - name: TRAVIGO_BATCH_ELASTICSEARCH_USER_SECRET
              value: {{ .Values.elasticsearch.accountSecret | quote }}
            - name: TRAVIGO_BATCH_REDIS_ADDRESS
              value: {{ .Values.redis.address | quote }}
            - name: TRAVIGO_BATCH_REDIS_PASSWORD_SECRET
              value: {{ .Values.redis.passwordSecret | quote }}
          {{- if .Values.batchRunner.persistence.enabled }}
          volumeMounts:
            - name: batch-runner-storage
              mountPath: {{ .Values.batchRunner.storagePath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.batchRunner.persistence.enabled }}
      volumes:
        - name: batch-runner-storage
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-batch-runner" (include "travigo-data-importer.fullname" .)) .Values.batchRunner.persistence.existingClaim }}
      {{- end }}
{{- end }}
